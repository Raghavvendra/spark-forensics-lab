[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-forensics-lab"
version = "0.1.0"
description = "A small experiment in explaining Spark stage behavior from event logs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
spark = ["pyspark>=4.2,<4.3"]
dev = ["pytest>=8,<10"]

[project.scripts]
spark-forensics-analyze = "spark_forensics.eventlog_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
